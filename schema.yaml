project:
  name: '"project_name"'
  board: selected_board
  resources: resources_available()
  ip: ip_available()
  pmods: pmods_available()
  modules: Vector{String}()
  testbenches: Vector{String}()
module:
  name: '"module_name"'
  ports: '"input clk,\ninput rst\n"'
  #parameters: '"\n"'
  # sara 11/4: a newline is not empty, so {{#parameters}} put #( ) in every header
  parameters: '""'
  signals: '"\n"'
  submodules: '"\n"'
  initial_assignments: '"\n"'
  continuous_assignments: '"\n"'
  always_comb_assignments: '"\n"'
  always_ff_assignments: '"\n"'
testbench:
  name: '"testbench"'
  #parameters: '"\n"'
  parameters: '""'   # Sara 11/4/26, same as module
  #stopping_condition: 'clk_count > 100'
  # sara (11/4): these are julia code, so this ran clk_count > 100 in julia
  # and new_testbench() threw UndefVarError. quoted like the others.
  stopping_condition: '"clk_count > 100"'
  signals: '"\n"'       
  submodules: '"\n"'
  initial_assignments: '"\n"'
  continuous_assignments: '"\n"'
  always_comb_assignments: '"\n"'
  always_ff_assignments: '"\n"'
  displays: '"\n"'
  monitors: '"\n"'
task:
  name: '"task_name"'
  automatic: true
  ports: '"\n"'
  behavior: '"\n"'
function:
  name: '"function_name"'
  width: '"[7:0]"'
  inputs: '""'
  behavior: '""'
  
